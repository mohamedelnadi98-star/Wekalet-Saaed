<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>وكالة سعيد — معاينة الشخصية</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#263138;color:#ece9df;font-family:Tahoma,Arial}body{display:flex;flex-direction:column}header{padding:14px 20px;background:#18252b}h1{font-size:18px;margin:0}p{font-size:12px;color:#c0c7c7;margin:7px 0 0}canvas{display:block;flex:1;min-height:0;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}footer{padding:12px;background:#18252b;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}button{background:#33484f;color:#efefea;border:1px solid #52636a;border-radius:9px;padding:10px 14px;cursor:pointer;touch-action:manipulation;user-select:none}button.active{background:#cda76b;color:#16232a}@media(max-height:480px){header{padding:7px 12px}p{display:none}footer{padding:6px;gap:5px}button{padding:7px 10px;font-size:12px}h1{font-size:14px}}</style><header><h1>وكالة سعيد · الشخصية الكاملة — من غير مريلة</h1><p>اسحب للدوران · عجلة الماوس أو إصبعان للزوم · هذا هو المجسم الفعلي المستخدم في اللعبة</p></header><canvas id="preview" aria-label="معاينة المجسم ثلاثي الأبعاد"></canvas><footer><button data-view="front">أمام</button><button data-view="side">جنب</button><button data-view="back">خلف</button><button data-view="three">زاوية</button><button data-view="face">الوجه</button><button data-mode="idle" class="active">وقوف</button><button data-mode="walk">مشي</button><button data-mode="carry">حمل كرتونة</button><button id="turn">دوران تلقائي</button></footer><script type="module" src="character-viewer.js"></script></html>
